<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disney Princess Memory Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.5s;
    overflow-x: hidden;
  }

  body.turn-p1 {
    background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f3e5f5);
  }

  body.turn-p2 {
    background: linear-gradient(135deg, #e3f2fd, #bbdefb, #e8eaf6);
  }

  body.solo-mode {
    background: linear-gradient(135deg, #fce4ec, #f3e5f5, #e8eaf6);
  }

  h1 {
    margin-top: 20px;
    font-size: 2.2rem;
    color: #7b1fa2;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 15px 0;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls label {
    font-size: 1rem;
    color: #4a148c;
    font-weight: 600;
  }

  .controls select, .controls button {
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid #ce93d8;
    font-size: 1rem;
    cursor: pointer;
  }

  .controls button {
    background: linear-gradient(135deg, #ab47bc, #7b1fa2);
    color: white;
    border: none;
    font-weight: 600;
    transition: transform 0.15s;
  }

  .controls button:hover { transform: scale(1.05); }

  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 10px 0;
    width: 100%;
    max-width: 600px;
  }

  .player-score {
    text-align: center;
    padding: 12px 30px;
    border-radius: 15px;
    font-size: 1.1rem;
    font-weight: 600;
    transition: all 0.4s;
    position: relative;
    opacity: 0.5;
  }

  .player-score.p1 {
    background: #e1bee7;
    color: #4a148c;
  }

  .player-score.p2 {
    background: #bbdefb;
    color: #0d47a1;
  }

  .player-score.active {
    transform: scale(1.15);
    opacity: 1;
    box-shadow: 0 0 20px rgba(156, 39, 176, 0.6);
  }

  .player-score.p2.active {
    box-shadow: 0 0 20px rgba(33, 150, 243, 0.6);
  }

  .player-score .score-num {
    font-size: 2rem;
    display: block;
  }

  .player-score .turn-arrow {
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5rem;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .player-score.active .turn-arrow {
    opacity: 1;
    animation: bounce 0.8s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }

  .turn-indicator {
    text-align: center;
    font-size: 1.4rem;
    margin: 5px 0 10px;
    font-weight: 700;
    min-height: 35px;
    transition: color 0.3s;
  }

  .turn-indicator.p1-turn { color: #7b1fa2; }
  .turn-indicator.p2-turn { color: #1565c0; }
  .turn-indicator.solo-turn { color: #6a1b9a; }

  /* Solo mode stats */
  .solo-stats {
    display: none;
    justify-content: center;
    gap: 30px;
    margin: 10px 0;
  }

  .solo-stats.visible { display: flex; }

  .solo-stat {
    text-align: center;
    padding: 10px 25px;
    border-radius: 15px;
    background: #f3e5f5;
    color: #4a148c;
    font-weight: 600;
  }

  .solo-stat .stat-num {
    font-size: 2rem;
    display: block;
  }

  .grid {
    display: grid;
    gap: 10px;
    padding: 10px;
    max-width: 900px;
    width: 100%;
    justify-content: center;
  }

  .card {
    aspect-ratio: 3/4;
    perspective: 800px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }

  .card-back {
    background: linear-gradient(135deg, #9c27b0, #e91e63);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-back::before {
    content: '';
    width: 60%;
    height: 60%;
    border: 3px solid rgba(255,255,255,0.4);
    border-radius: 50%;
  }

  .card-back::after {
    content: '\2728';
    position: absolute;
    font-size: 2rem;
  }

  .card-front {
    transform: rotateY(180deg);
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .card-front img {
    width: 100%;
    height: 80%;
    object-fit: contain;
    padding: 5px;
  }

  .card-front .char-name {
    font-size: 0.8rem;
    font-weight: 600;
    color: #4a148c;
    padding: 2px 0 5px;
    text-align: center;
  }

  /* Match celebration */
  .card.matched .card-front {
    background: linear-gradient(135deg, #fff9c4, #fff176);
    animation: matchGlow 0.6s ease-out;
  }

  .card.matched {
    cursor: default;
    animation: matchBounce 0.6s ease-out;
  }

  @keyframes matchBounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.15); }
    50% { transform: scale(0.95); }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  @keyframes matchGlow {
    0% { box-shadow: 0 0 0 rgba(255, 215, 0, 0); }
    50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.4); }
    100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
  }

  /* Sparkle particles */
  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    font-size: 1.5rem;
    animation: sparkleFly 1s ease-out forwards;
  }

  @keyframes sparkleFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0) rotate(360deg); }
  }

  /* Match banner */
  .match-banner {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 60;
    font-size: 3rem;
    font-weight: 800;
    color: #ff6f00;
    text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
    pointer-events: none;
    white-space: nowrap;
  }

  .match-banner.show {
    animation: bannerPop 1s ease-out forwards;
  }

  @keyframes bannerPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(1) rotate(-1deg); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.5) rotate(0deg); opacity: 0; }
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .overlay.visible { display: flex; }

  .win-screen {
    background: white;
    border-radius: 25px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    animation: popIn 0.4s ease-out;
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .win-screen h2 {
    font-size: 2rem;
    color: #7b1fa2;
    margin-bottom: 10px;
  }

  .win-screen p {
    font-size: 1.2rem;
    color: #555;
    margin-bottom: 20px;
  }

  .win-screen button {
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #ab47bc, #7b1fa2);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .win-screen button:hover { transform: scale(1.05); }
</style>
</head>
<body class="turn-p1">

<h1>Disney Princess Memory Match</h1>

<div class="controls">
  <label for="gameMode">Mode:</label>
  <select id="gameMode">
    <option value="solo">Solo</option>
    <option value="vs" selected>VS (2 Players)</option>
  </select>
  <label for="pairCount">Pairs:</label>
  <select id="pairCount">
    <option value="4">4 (Easy)</option>
    <option value="6">6</option>
    <option value="8" selected>8</option>
    <option value="10">10</option>
    <option value="12">12</option>
    <option value="16">16 (Hard)</option>
  </select>
  <button onclick="newGame()">New Game</button>
</div>

<!-- VS mode scoreboard -->
<div class="scoreboard" id="vsScoreboard">
  <div class="player-score p1 active" id="p1score">
    <div class="turn-arrow">&#11015;</div>
    Player 1
    <span class="score-num" id="p1num">0</span>
  </div>
  <div class="player-score p2" id="p2score">
    <div class="turn-arrow">&#11015;</div>
    Player 2
    <span class="score-num" id="p2num">0</span>
  </div>
</div>

<!-- Solo mode stats -->
<div class="solo-stats" id="soloStats">
  <div class="solo-stat">
    Matches
    <span class="stat-num" id="soloMatches">0</span>
  </div>
  <div class="solo-stat">
    Turns
    <span class="stat-num" id="soloTurns">0</span>
  </div>
</div>

<div class="turn-indicator p1-turn" id="turnIndicator">Player 1's turn</div>

<div class="grid" id="grid"></div>

<div class="match-banner" id="matchBanner"></div>

<div class="overlay" id="overlay">
  <div class="win-screen">
    <h2 id="winTitle">You Win!</h2>
    <p id="winMsg"></p>
    <button onclick="newGame(); document.getElementById('overlay').classList.remove('visible');">Play Again</button>
  </div>
</div>

<script>
const CHARACTERS = [
  { name: 'Elsa', img: 'images/elsa.jpg' },
  { name: 'Anna', img: 'images/anna.jpg' },
  { name: 'Moana', img: 'images/moana.png' },
  { name: 'Rapunzel', img: 'images/rapunzel.jpg' },
  { name: 'Ariel', img: 'images/ariel.jpg' },
  { name: 'Belle', img: 'images/belle.jpg' },
  { name: 'Cinderella', img: 'images/cinderella.jpg' },
  { name: 'Jasmine', img: 'images/jasmine.jpg' },
  { name: 'Snow White', img: 'images/snow_white.jpg' },
  { name: 'Tiana', img: 'images/tiana.jpg' },
  { name: 'Mulan', img: 'images/mulan.jpg' },
  { name: 'Merida', img: 'images/merida.jpg' },
  { name: 'Aurora', img: 'images/aurora.jpg' },
  { name: 'Pocahontas', img: 'images/pocahontas.jpg' },
  { name: 'Mirabel', img: 'images/mirabel.png' },
  { name: 'Raya', img: 'images/raya.jpg' },
];

const MATCH_PHRASES = [
  "Amazing!", "You found {name}!", "Wonderful!",
  "Magical!", "Sparkle sparkle!", "Princess power!",
  "Perfect match!", "Beautiful!", "Hooray!",
  "Fantastic!", "You did it!", "Dazzling!",
];

let gameMode = 'vs';
let currentPlayer = 0;
let scores = [0, 0];
let soloTurns = 0;
let flippedCards = [];
let matchedCount = 0;
let totalPairs = 0;
let locked = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function gridColumns(count) {
  // Map each pair count to columns that divide evenly into total cards
  const total = count * 2;
  const colMap = { 8:4, 12:4, 16:4, 20:5, 24:6, 32:8 };
  return colMap[total] || 4;
}

function newGame() {
  gameMode = document.getElementById('gameMode').value;
  const pairCount = parseInt(document.getElementById('pairCount').value);
  totalPairs = pairCount;
  currentPlayer = 0;
  scores = [0, 0];
  soloTurns = 0;
  flippedCards = [];
  matchedCount = 0;
  locked = false;

  // Show/hide scoreboards based on mode
  const vsBoard = document.getElementById('vsScoreboard');
  const soloBoard = document.getElementById('soloStats');
  if (gameMode === 'solo') {
    vsBoard.style.display = 'none';
    soloBoard.classList.add('visible');
    document.body.className = 'solo-mode';
  } else {
    vsBoard.style.display = 'flex';
    soloBoard.classList.remove('visible');
    document.body.className = 'turn-p1';
  }

  updateScoreboard();

  const selected = shuffle([...CHARACTERS]).slice(0, pairCount);
  const cards = shuffle([...selected, ...selected]);

  const grid = document.getElementById('grid');
  const cols = gridColumns(pairCount);
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(80px, 130px))`;
  grid.innerHTML = '';

  cards.forEach((char, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = char.name;
    card.dataset.index = i;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front">
          <img src="${char.img}" alt="${char.name}" draggable="false">
          <div class="char-name">${char.name}</div>
        </div>
      </div>
    `;
    card.addEventListener('click', () => flipCard(card));
    grid.appendChild(card);
  });
}

function flipCard(card) {
  if (locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    locked = true;
    if (gameMode === 'solo') soloTurns++;
    const [a, b] = flippedCards;

    if (a.dataset.name === b.dataset.name) {
      setTimeout(() => {
        a.classList.add('matched');
        b.classList.add('matched');
        scores[currentPlayer]++;
        matchedCount++;
        updateScoreboard();

        // Celebration!
        celebrateMatch(a, b, a.dataset.name);

        flippedCards = [];
        locked = false;

        if (matchedCount === totalPairs) {
          setTimeout(showWinner, 1200);
        }
      }, 400);
    } else {
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        flippedCards = [];
        if (gameMode === 'vs') {
          currentPlayer = 1 - currentPlayer;
        }
        updateScoreboard();
        locked = false;
      }, 1000);
    }
  }
}

function celebrateMatch(cardA, cardB, charName) {
  // Spawn sparkles from both cards
  [cardA, cardB].forEach(card => {
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 8; i++) {
      spawnSparkle(cx, cy);
    }
  });

  // Show match banner
  const banner = document.getElementById('matchBanner');
  const phrase = MATCH_PHRASES[Math.floor(Math.random() * MATCH_PHRASES.length)];
  banner.textContent = phrase.replace('{name}', charName);
  banner.classList.remove('show');
  void banner.offsetWidth; // reflow
  banner.classList.add('show');
}

function spawnSparkle(x, y) {
  const el = document.createElement('div');
  el.className = 'sparkle';
  const symbols = ['\u2728', '\u2B50', '\u1F496', '\u2764', '\u1FA77', '\u2744'];
  el.textContent = ['✨', '⭐', '💖', '💫', '🌟', '❤️'][Math.floor(Math.random() * 6)];
  const angle = Math.random() * Math.PI * 2;
  const dist = 60 + Math.random() * 80;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
  el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
  el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function updateScoreboard() {
  const indicator = document.getElementById('turnIndicator');

  if (gameMode === 'solo') {
    document.getElementById('soloMatches').textContent = matchedCount;
    document.getElementById('soloTurns').textContent = soloTurns;
    indicator.textContent = `Find all the princesses!`;
    indicator.className = 'turn-indicator solo-turn';
    return;
  }

  document.getElementById('p1num').textContent = scores[0];
  document.getElementById('p2num').textContent = scores[1];

  const p1 = document.getElementById('p1score');
  const p2 = document.getElementById('p2score');
  p1.classList.toggle('active', currentPlayer === 0);
  p2.classList.toggle('active', currentPlayer === 1);

  if (currentPlayer === 0) {
    indicator.textContent = "Player 1's turn";
    indicator.className = 'turn-indicator p1-turn';
    document.body.className = 'turn-p1';
  } else {
    indicator.textContent = "Player 2's turn";
    indicator.className = 'turn-indicator p2-turn';
    document.body.className = 'turn-p2';
  }
}

function showWinner() {
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('winTitle');
  const msg = document.getElementById('winMsg');

  if (gameMode === 'solo') {
    title.textContent = 'You Found Them All!';
    msg.textContent = `${matchedCount} matches in ${soloTurns} turns`;
  } else if (scores[0] > scores[1]) {
    title.textContent = 'Player 1 Wins!';
    msg.textContent = `${scores[0]} - ${scores[1]}`;
  } else if (scores[1] > scores[0]) {
    title.textContent = 'Player 2 Wins!';
    msg.textContent = `${scores[1]} - ${scores[0]}`;
  } else {
    title.textContent = "It's a Tie!";
    msg.textContent = `${scores[0]} - ${scores[1]}`;
  }

  // Big sparkle burst for the win
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      spawnSparkle(
        window.innerWidth * 0.2 + Math.random() * window.innerWidth * 0.6,
        window.innerHeight * 0.2 + Math.random() * window.innerHeight * 0.6
      );
    }, i * 50);
  }

  overlay.classList.add('visible');
}

newGame();
</script>
</body>
</html>
